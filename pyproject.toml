[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "napcat-grok-bridge"
version = "0.3.1"
description = "A single-peer, bidirectional NapCat and Grok Bot bridge"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "napcat-grok-bridge contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
napcat-grok-doctor = "napcat_grok_bridge.doctor:main"
napcat-grok-routine = "napcat_grok_bridge.routine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napcat_grok_bridge = ["templates/*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
